# Tooling configuration for the whole repository.
#
# This file deliberately has no [project] or [build-system] table: the repo
# root is not itself a distribution. The two distributions live under
# packages/ and carry their own pyproject.toml. ruff, mypy and pytest all
# discover this file from the rootdir, so tool settings stay in one place
# instead of being duplicated per package.
#
#   pip install -e ./packages/docflow-core
#   pip install -e "./packages/paperflow[service,dev]"

[tool.ruff]
line-length = 100
target-version = "py311"

# The legacy tree is excluded, not fixed: every path listed here is deleted or
# rewritten before the migration ends, and each file rejoins the linter as it
# moves into packages/. Linting code that is on its way out would produce a
# large diff that has to be reviewed and then thrown away.
extend-exclude = [
    "docsorter_common",
    "ocr_webhook_service",
    "DocSorter.py",
    "find_duplicates.py",
    "trigger_missing_cascade.py",
    "set_tag_colors.py",
    # Diagnostic scripts. Kept as an archive of what was measured; not
    # production code and not held to its standards.
    "test",
    "experiments",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = [
    # The project uses f-strings in log calls throughout; rewriting them all to
    # %-style lazy formatting buys nothing here (log volume is a few lines per
    # document) and would churn every call site.
    "G004",
]

[tool.ruff.lint.isort]
# Both distributions live in this repository; without this they are sorted in
# with third-party packages and the import blocks churn between runs.
known-first-party = ["docflow", "paperflow"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Logs are never localized. Only the app layer may reach for the catalog;
# adapters, pipeline and llm_tasks emit English log records and nothing else.
# Without this rule the boundary rots the first time someone "just wants a
# nicer message" in a library module.
"paperflow.i18n".msg = "i18n belongs to apps/ only - library code logs in English"

[tool.ruff.lint.per-file-ignores]
"packages/paperflow/src/paperflow/apps/**" = ["TID251"]
# uvicorn imports app.py directly - there is no main() of ours to call first - so
# limit_math_threads() has to run at module scope before the imports that would
# otherwise pull in numpy/onnxruntime as a side effect. See the module docstring.
"packages/paperflow/src/paperflow/apps/service/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# The pure layers carry the invariants worth enforcing; adapters wrap
# third-party libraries that are largely unannotated, so strict mode there
# would produce noise rather than signal.
[[tool.mypy.overrides]]
module = [
    "docflow.domain.*",
    "docflow.ports.*",
    "docflow.pipeline.*",
    "paperflow.domain.*",
    "paperflow.pipeline.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "rapidocr.*",
    "rapidocr_onnxruntime.*",
    "onnxruntime.*",
    "imagehash.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.oauth2.*",
    "google.auth.*",
]
ignore_missing_imports = true

# numpy's own bundled stubs use PEP 695 `type` statements, which mypy can only parse
# under python_version >= 3.12 - a type-checking-only requirement numpy added that has
# nothing to do with what Python versions numpy actually runs on. Checked at the
# project's target of 3.11, parsing those stubs is a hard error rather than a type
# error, so numpy is treated as untyped here instead of upgrading the project-wide
# target and losing 3.11-incompatible-syntax detection everywhere else.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
